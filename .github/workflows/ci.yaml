name: "CI"
on:
  workflow_dispatch:
  schedule:
    - cron: "00 01 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install nix
        uses: cachix/install-nix-action@v31.10.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Update
        run: nix flake update
      - name: Build
        run: nix build .#nixosConfigurations.legion.config.system.build.toplevel
